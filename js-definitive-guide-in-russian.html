<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JavaScript: Полное руководство — Дэвид Флэнаган (7-е издание)</title>
<style>
  :root {
    --bg: #0f1117;
    --sidebar-bg: #161b22;
    --card-bg: #1c2128;
    --border: #30363d;
    --accent: #f7c948;
    --accent2: #58a6ff;
    --accent3: #3fb950;
    --text: #e6edf3;
    --text-muted: #8b949e;
    --code-bg: #161b22;
    --hover: #21262d;
    --tag-bg: #1f2d3d;
    --sidebar-w: 290px;
  }
  .light-mode {
    --bg: #f6f8fa;
    --sidebar-bg: #ffffff;
    --card-bg: #ffffff;
    --border: #d0d7de;
    --text: #1f2328;
    --text-muted: #636c76;
    --code-bg: #f6f8fa;
    --hover: #eaeef2;
    --tag-bg: #ddf4ff;
    --accent2: #0969da;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    min-height: 100vh;
    font-size: 15px;
    line-height: 1.7;
  }

  /* ── SIDEBAR ── */
  #sidebar {
    width: var(--sidebar-w);
    background: var(--sidebar-bg);
    border-right: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    position: fixed;
    top: 0; left: 0; bottom: 0;
    overflow-y: auto;
    z-index: 100;
    transition: transform .3s ease;
  }
  #sidebar::-webkit-scrollbar { width: 5px; }
  #sidebar::-webkit-scrollbar-track { background: transparent; }
  #sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
  .sidebar-header {
    padding: 20px 18px 14px;
    border-bottom: 1px solid var(--border);
    background: var(--sidebar-bg);
    position: sticky; top: 0; z-index: 10;
  }
  .sidebar-header h1 {
    font-size: 13.5px;
    font-weight: 700;
    color: var(--accent);
    letter-spacing: .4px;
    line-height: 1.4;
    margin-bottom: 2px;
  }
  .sidebar-header p {
    font-size: 11px;
    color: var(--text-muted);
  }
  .search-wrap {
    padding: 12px 14px 8px;
    position: sticky;
    top: 72px;
    background: var(--sidebar-bg);
    z-index: 9;
  }
  #searchInput {
    width: 100%;
    padding: 7px 10px;
    background: var(--hover);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 13px;
    outline: none;
    transition: border-color .2s;
  }
  #searchInput:focus { border-color: var(--accent2); }
  #searchInput::placeholder { color: var(--text-muted); }
  .chapter-list { padding: 6px 0 20px; }
  .ch-item {
    display: flex;
    align-items: center;
    gap: 9px;
    padding: 9px 16px;
    cursor: pointer;
    transition: background .15s;
    border-left: 3px solid transparent;
    font-size: 13.5px;
  }
  .ch-item:hover { background: var(--hover); }
  .ch-item.active {
    background: var(--hover);
    border-left-color: var(--accent);
    color: var(--accent);
  }
  .ch-item.done .ch-num { background: var(--accent3); color: #000; }
  .ch-num {
    min-width: 24px; height: 24px;
    border-radius: 50%;
    background: var(--border);
    color: var(--text-muted);
    font-size: 11px;
    font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .ch-title { flex: 1; line-height: 1.3; }
  .ch-check {
    width: 16px; height: 16px;
    border-radius: 3px;
    border: 1.5px solid var(--border);
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent3);
    appearance: none;
    -webkit-appearance: none;
    display: flex; align-items: center; justify-content: center;
    background: transparent;
  }
  .ch-check.checked {
    background: var(--accent3);
    border-color: var(--accent3);
  }
  .ch-check.checked::after {
    content: "✓";
    font-size: 10px;
    color: #000;
    font-weight: 900;
  }
  .progress-bar-wrap {
    padding: 8px 16px 4px;
    position: sticky; top: 72px;
    background: var(--sidebar-bg);
  }
  .progress-label {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    display: flex; justify-content: space-between;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent3), var(--accent2));
    border-radius: 2px;
    transition: width .4s ease;
    width: 0%;
  }

  /* ── MAIN ── */
  #main {
    margin-left: var(--sidebar-w);
    flex: 1;
    display: flex;
    flex-direction: column;
  }
  #topbar {
    background: var(--sidebar-bg);
    border-bottom: 1px solid var(--border);
    padding: 10px 32px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    position: sticky; top: 0; z-index: 50;
  }
  .topbar-left {
    display: flex; align-items: center; gap: 12px;
  }
  #currentChapterLabel {
    font-size: 14px;
    font-weight: 600;
    color: var(--text);
  }
  .topbar-btns { display: flex; gap: 8px; }
  .btn {
    padding: 6px 14px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--hover);
    color: var(--text);
    font-size: 13px;
    cursor: pointer;
    transition: background .15s, border-color .15s;
  }
  .btn:hover { background: var(--border); }
  .btn-accent {
    background: var(--accent);
    color: #000;
    border-color: var(--accent);
    font-weight: 600;
  }
  .btn-accent:hover { opacity: .88; background: var(--accent); }

  #content {
    padding: 40px 60px;
    max-width: 960px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── CHAPTER SECTION ── */
  .chapter-page { display: none; }
  .chapter-page.visible { display: block; }

  .chapter-hero {
    margin-bottom: 32px;
    padding-bottom: 24px;
    border-bottom: 1px solid var(--border);
  }
  .chapter-badge {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--accent2);
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .8px;
    text-transform: uppercase;
    padding: 3px 10px;
    border-radius: 20px;
    margin-bottom: 10px;
  }
  .chapter-hero h2 {
    font-size: 28px;
    font-weight: 700;
    line-height: 1.2;
    margin-bottom: 12px;
    color: var(--text);
  }
  .chapter-hero .subtitle {
    font-size: 15px;
    color: var(--text-muted);
    max-width: 680px;
  }

  /* ── CARDS / SECTIONS ── */
  .section-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .section-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    cursor: pointer;
    user-select: none;
    transition: background .15s;
  }
  .section-header:hover { background: var(--hover); }
  .section-header h3 {
    font-size: 15px;
    font-weight: 600;
    display: flex; align-items: center; gap: 8px;
  }
  .section-icon {
    font-size: 16px;
    width: 28px; text-align: center;
  }
  .chevron {
    font-size: 12px;
    color: var(--text-muted);
    transition: transform .25s;
  }
  .section-card.open .chevron { transform: rotate(90deg); }
  .section-body {
    display: none;
    padding: 0 20px 20px;
    border-top: 1px solid var(--border);
  }
  .section-card.open .section-body { display: block; }

  /* ── TYPOGRAPHY ── */
  .section-body p { margin-top: 14px; color: var(--text); }
  .section-body ul, .section-body ol {
    margin: 12px 0 0 20px;
    color: var(--text);
  }
  .section-body li { margin-bottom: 6px; }
  .section-body strong { color: var(--accent); font-weight: 600; }
  .section-body em { color: var(--accent2); font-style: normal; }

  /* ── CODE ── */
  .code-block {
    background: var(--code-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    margin-top: 14px;
    overflow: hidden;
  }
  .code-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 7px 14px;
    border-bottom: 1px solid var(--border);
    font-size: 11.5px;
    color: var(--text-muted);
  }
  .copy-btn {
    background: none;
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text-muted);
    padding: 2px 8px;
    font-size: 11px;
    cursor: pointer;
  }
  .copy-btn:hover { background: var(--hover); color: var(--text); }
  pre {
    margin: 0;
    padding: 16px 18px;
    overflow-x: auto;
    font-size: 13.5px;
    line-height: 1.6;
    font-family: "Fira Code", "Cascadia Code", Consolas, monospace;
  }
  .kw { color: #ff7b72; }
  .fn { color: #d2a8ff; }
  .str { color: #a5d6ff; }
  .num { color: #f2cc60; }
  .cm { color: #8b949e; font-style: italic; }
  .op { color: #ff7b72; }
  .cl { color: #ffa657; }
  .prop { color: #79c0ff; }

  /* ── NOTES BOX ── */
  .notes-box {
    border: 1.5px dashed var(--accent);
    border-radius: 8px;
    margin-top: 20px;
    overflow: hidden;
  }
  .notes-box-header {
    background: rgba(247,201,72,.08);
    padding: 10px 16px;
    font-size: 12.5px;
    font-weight: 600;
    color: var(--accent);
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .notes-textarea {
    width: 100%;
    min-height: 90px;
    padding: 12px 16px;
    background: transparent;
    border: none;
    color: var(--text);
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    outline: none;
  }
  .notes-textarea::placeholder { color: var(--text-muted); }

  /* ── TIP BOX ── */
  .tip-box {
    background: rgba(88,166,255,.07);
    border-left: 3px solid var(--accent2);
    border-radius: 0 6px 6px 0;
    padding: 12px 16px;
    margin-top: 14px;
    font-size: 13.5px;
  }
  .warn-box {
    background: rgba(247,201,72,.07);
    border-left: 3px solid var(--accent);
    border-radius: 0 6px 6px 0;
    padding: 12px 16px;
    margin-top: 14px;
    font-size: 13.5px;
  }

  /* ── TAGS ── */
  .tag {
    display: inline-block;
    background: var(--tag-bg);
    color: var(--accent2);
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 20px;
    margin: 3px 2px;
    border: 1px solid rgba(88,166,255,.2);
  }

  /* ── WELCOME ── */
  #welcomePage {
    text-align: center;
    padding: 80px 40px;
  }
  #welcomePage h1 {
    font-size: 38px;
    font-weight: 800;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    margin-bottom: 16px;
  }
  #welcomePage p {
    font-size: 16px;
    color: var(--text-muted);
    max-width: 560px;
    margin: 0 auto 40px;
  }
  .chapter-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
    gap: 12px;
    max-width: 820px;
    margin: 0 auto;
    text-align: left;
  }
  .grid-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    cursor: pointer;
    transition: border-color .2s, transform .2s;
  }
  .grid-card:hover {
    border-color: var(--accent2);
    transform: translateY(-2px);
  }
  .grid-card .g-num {
    font-size: 11px;
    color: var(--text-muted);
    margin-bottom: 4px;
    font-weight: 700;
  }
  .grid-card .g-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  /* ── NAV ARROWS ── */
  .chapter-nav {
    display: flex;
    justify-content: space-between;
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  /* ── RESPONSIVE ── */
  #menuToggle {
    display: none;
    background: none;
    border: none;
    font-size: 22px;
    cursor: pointer;
    color: var(--text);
    padding: 4px 8px;
  }
  @media(max-width: 768px) {
    :root { --sidebar-w: 0px; }
    #sidebar { transform: translateX(-290px); width: 290px; }
    #sidebar.open { transform: translateX(0); }
    #main { margin-left: 0; }
    #menuToggle { display: block; }
    #content { padding: 24px 20px; }
  }

  /* scrollbar main */
  #content::-webkit-scrollbar { width: 7px; }
  #content::-webkit-scrollbar-track { background: transparent; }
  #content::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  /* ── NOTES VIEWER ── */
  .notes-toolbar { display:flex; gap:6px; padding:8px 16px 0; }
  .notes-tab {
    background:none; border:1px solid var(--border); border-radius:4px;
    color:var(--text-muted); font-size:12px; padding:3px 10px;
    cursor:pointer; transition:all .15s;
  }
  .notes-tab.active           { background:var(--accent); color:#000; border-color:var(--accent); font-weight:600; }
  .notes-tab:not(.active):hover { background:var(--hover); color:var(--text); }
  .notes-textarea {
    width:100%; min-height:500px; padding:14px 18px;
    background:transparent; border:none; color:var(--text);
    font-size:13px; font-family:'Fira Code',Consolas,monospace;
    resize:vertical; outline:none; line-height:1.7;
  }
  .notes-textarea::placeholder { color:var(--text-muted); }
  .notes-view { padding:14px 20px 20px; font-size:13.5px; line-height:1.75; }
  .notes-view h1 { font-size:17px; font-weight:700; color:var(--accent); margin:18px 0 8px; padding-bottom:6px; border-bottom:1px solid var(--border); }
  .notes-view h2 { font-size:14.5px; font-weight:700; color:var(--accent2); margin:14px 0 5px; }
  .notes-view h3 { font-size:13px; font-weight:600; color:var(--accent3,#3fb950); margin:10px 0 4px; }
  .notes-view p  { margin:7px 0; }
  .notes-view ul, .notes-view ol { margin:5px 0 5px 20px; }
  .notes-view li { margin-bottom:3px; }
  .notes-view strong { color:var(--accent); font-weight:600; }
  .notes-view em     { color:var(--accent2); font-style:italic; }
  .notes-view code {
    background:var(--code-bg); border:1px solid var(--border); border-radius:4px;
    padding:1px 6px; font-family:'Fira Code',Consolas,monospace; font-size:12px; color:#a5d6ff;
  }
  .notes-view pre { background:var(--code-bg); border:1px solid var(--border); border-radius:8px; padding:12px 16px; overflow-x:auto; margin:8px 0; }
  .notes-view pre code { background:none; border:none; padding:0; font-size:12.5px; color:var(--text); line-height:1.6; }
  .notes-view table   { border-collapse:collapse; width:100%; margin:10px 0; font-size:12.5px; }
  .notes-view th      { background:var(--hover); padding:5px 10px; border:1px solid var(--border); color:var(--accent2); text-align:left; }
  .notes-view td      { padding:5px 10px; border:1px solid var(--border); }
  .notes-view blockquote { border-left:3px solid var(--accent); padding:6px 12px; margin:8px 0; background:rgba(247,201,72,.05); color:var(--text-muted); }

  </style>
</head>
<body>

<!-- SIDEBAR -->
<nav id="sidebar">
  <div class="sidebar-header">
    <h1>📘 JavaScript: Полное руководство</h1>
    <p>Дэвид Флэнаган • 7-е издание</p>
  </div>
  <div style="padding: 10px 14px 4px;">
    <div class="progress-label">
      <span>Прогресс</span>
      <span id="progressText">0 / 17</span>
    </div>
    <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
  </div>
  <div class="search-wrap">
    <input type="text" id="searchInput" placeholder="🔍 Поиск по главам..." oninput="filterChapters(this.value)">
  </div>
  <div class="chapter-list" id="chapterList">
    <!-- generated by JS -->
  </div>
</nav>

<!-- MAIN -->
<div id="main">
  <header id="topbar">
    <div class="topbar-left">
      <button id="menuToggle" onclick="toggleSidebar()">☰</button>
      <span id="currentChapterLabel">Добро пожаловать</span>
    </div>
    <div class="topbar-btns">
      <button class="btn" onclick="toggleTheme()">🌙 Тема</button>
      <button class="btn" onclick="saveNotes()">💾 Сохранить заметки</button>
    </div>
  </header>

  <div id="content">

    <!-- WELCOME -->
    <div id="welcomePage">
      <h1>JavaScript: Полное руководство</h1>
      <p>Конспект по книге Дэвида Флэнагана (7-е издание). 17 глав, примеры кода, заметки и интерактивное изучение.</p>
      <div class="chapter-grid" id="welcomeGrid"></div>
    </div>

    <!-- CHAPTERS WILL BE INSERTED HERE BY JS -->

  </div>
</div>

<script>
// ─────────────────────────────────────────────
// DATA
// ─────────────────────────────────────────────
const chapters = [
  {
    num: 1,
    title: "Введение в JavaScript",
    subtitle: "Обзор языка, его истории, версий ECMAScript и роли в современной разработке.",
    sections: [
      {
        icon: "🌐", title: "Что такое JavaScript?",
        content: `<p>JavaScript — интерпретируемый, объектно-ориентированный язык программирования с динамической типизацией. Созданный в 1995 году Бренданом Айком в Netscape, сегодня он является основным языком веба.</p>
        <ul>
          <li><strong>ECMAScript</strong> — официальный стандарт языка (ECMA-262)</li>
          <li><strong>ES6/ES2015</strong> — поворотный момент: классы, стрелочные функции, Promise и многое другое</li>
          <li><strong>ES2020</strong> — версия, описанная в 7-м издании книги</li>
        </ul>
        <div class="tip-box">💡 JavaScript работает в браузере (клиент) и на сервере (Node.js), что делает его универсальным языком full-stack разработки.</div>`,
        code: `// Традиционный "Hello, World!" в JavaScript
console.log(<span class="str">"Hello, World!"</span>);

// В браузере
document.querySelector(<span class="str">"#app"</span>).textContent = <span class="str">"Привет, JavaScript!"</span>;

// В Node.js
<span class="kw">const</span> http = <span class="fn">require</span>(<span class="str">"http"</span>);
<span class="fn">http.createServer</span>((req, res) => {
  res.<span class="fn">end</span>(<span class="str">"Работает на Node.js!"</span>);
}).<span class="fn">listen</span>(<span class="num">3000</span>);`
      },
      {
        icon: "📜", title: "Версии и стандарты",
        content: `<p>JavaScript развивается через ежегодные выпуски стандарта ECMAScript. Каждая версия добавляет новые возможности языка.</p>
        <ul>
          <li><strong>ES5 (2009)</strong> — строгий режим, JSON, Array методы</li>
          <li><strong>ES6/ES2015</strong> — классы, модули, let/const, Promise, стрелочные функции</li>
          <li><strong>ES2017</strong> — async/await</li>
          <li><strong>ES2020</strong> — опциональная цепочка ?., нулевое слияние ??</li>
        </ul>`
      }
    ]
  },
  {
    num: 2,
    title: "Лексическая структура",
    subtitle: "Кодировка, пробелы, комментарии, литералы, идентификаторы и зарезервированные слова.",
    sections: [
      {
        icon: "🔤", title: "Текст программы",
        content: `<p>JavaScript использует <strong>Unicode</strong>-кодировку, что позволяет применять символы любого языка в строках и идентификаторах. Программы чувствительны к регистру: <em>myVar</em> и <em>myvar</em> — разные переменные.</p>
        <ul>
          <li>Пробелы и переносы строк игнорируются (кроме строк)</li>
          <li>Точки с запятой в конце операторов — опциональны (ASI)</li>
          <li>Комментарии: <strong>//</strong> однострочный, <strong>/* */</strong> многострочный</li>
        </ul>
        <div class="warn-box">⚠️ <strong>ASI (Automatic Semicolon Insertion)</strong> — JavaScript автоматически вставляет точки с запятой. Это может приводить к неожиданным ошибкам. Рекомендуется всегда ставить ; явно.</div>`,
        code: `<span class="cm">// Однострочный комментарий</span>

// ─────────────────────────────────────────────
// RENDER SIDEBAR
// ─────────────────────────────────────────────
function renderSidebar() {
  const list = document.getElementById("chapterList");
  list.innerHTML = chapters.map(ch => `
    <div class="ch-item" id="nav-${ch.num}" onclick="showChapter(${ch.num})">
      <div class="ch-num">${ch.num}</div>
      <div class="ch-title">${ch.title}</div>
      <div class="ch-check ${isDone(ch.num) ? 'checked' : ''}" onclick="toggleDone(event, ${ch.num})"></div>
    </div>
  `).join('');
}

// ─────────────────────────────────────────────
// RENDER WELCOME GRID
// ─────────────────────────────────────────────
function renderWelcomeGrid() {
  document.getElementById("welcomeGrid").innerHTML = chapters.map(ch => `
    <div class="grid-card" onclick="showChapter(${ch.num})">
      <div class="g-num">Глава ${ch.num}</div>
      <div class="g-title">${ch.title}</div>
    </div>
  `).join('');
}

// ─────────────────────────────────────────────
// RENDER CHAPTER PAGES
// ─────────────────────────────────────────────
function renderChapters() {
  const content = document.getElementById("content");
  chapters.forEach(ch => {
    const div = document.createElement("div");
    div.className = "chapter-page";
    div.id = `chapter-${ch.num}`;

    const prevNum = ch.num - 1;
    const nextNum = ch.num + 1;
    const prevBtn = prevNum >= 1
      ? `<button class="btn" onclick="showChapter(${prevNum})">← Глава ${prevNum}</button>`
      : `<span></span>`;
    const nextBtn = nextNum <= 17
      ? `<button class="btn btn-accent" onclick="showChapter(${nextNum})">Глава ${nextNum} →</button>`
      : `<span></span>`;

    div.innerHTML = `
      <div class="chapter-hero">
        <div class="chapter-badge">Глава ${ch.num} из 17</div>
        <h2>${ch.title}</h2>
        <p class="subtitle">${ch.subtitle}</p>
      </div>
      ${ch.sections.map((sec, idx) => `
        <div class="section-card open" id="sec-${ch.num}-${idx}">
          <div class="section-header" onclick="toggleSection(this.parentElement)">
            <h3><span class="section-icon">${sec.icon}</span>${sec.title}</h3>
            <span class="chevron">▶</span>
          </div>
          <div class="section-body">
            ${sec.content}
            ${sec.code ? `
              <div class="code-block">
                <div class="code-header">
                  <span>JavaScript</span>
                  <button class="copy-btn" onclick="copyCode(this)">📋 Копировать</button>
                </div>
                <pre>${sec.code}</pre>
              </div>
            ` : ''}
          </div>
        </div>
      `).join('')}

      <div class="section-card">
        <div class="section-header" onclick="toggleSection(this.parentElement)">
          <h3><span class="section-icon">📝</span>Мои заметки — Глава ${ch.num}</h3>
          <span class="chevron">▶</span>
        </div>
        <div class="section-body">
          <div class="notes-box" id="nbox-${ch.num}">
            <div class="notes-box-header">📝 Мои заметки</div>
            <div class="notes-toolbar">
              <button class="notes-tab active" onclick="notesTab(${ch.num},'view')">👁 Просмотр</button>
              <button class="notes-tab"        onclick="notesTab(${ch.num},'edit')">✏️ Редактировать</button>
            </div>
            <div class="notes-view" id="nview-${ch.num}"></div>
            <textarea class="notes-textarea" id="notes-${ch.num}"
              style="display:none"
              placeholder="Ваши заметки по главе ${ch.num}…"
              oninput="localStorage.setItem('note-ch-${ch.num}', this.value)"
            ></textarea>
          </div>
        </div>
      </div>

      <div class="chapter-nav">
        ${prevBtn}
        <button class="btn" onclick="markDone(${ch.num})">
          ${isDone(ch.num) ? '✅ Изучена' : '☐ Отметить изученной'}
        </button>
        ${nextBtn}
      </div>
    `;
    content.appendChild(div);
  });
}

// ─────────────────────────────────────────────
// NAVIGATION
// ─────────────────────────────────────────────
let currentChapter = 0;

function showWelcome() {
  document.querySelectorAll(".chapter-page").forEach(p => p.classList.remove("visible"));
  document.getElementById("welcomePage").style.display = "block";
  document.querySelectorAll(".ch-item").forEach(i => i.classList.remove("active"));
  document.getElementById("currentChapterLabel").textContent = "Добро пожаловать";
  currentChapter = 0;
}

function showChapter(num) {
  document.getElementById("welcomePage").style.display = "none";
  document.querySelectorAll(".chapter-page").forEach(p => p.classList.remove("visible"));
  document.getElementById(`chapter-${num}`).classList.add("visible");
  document.querySelectorAll(".ch-item").forEach(i => i.classList.remove("active"));
  document.getElementById(`nav-${num}`).classList.add("active");
  document.getElementById("currentChapterLabel").textContent =
    `Глава ${num}: ${chapters[num-1].title}`;
  document.getElementById("content").scrollTop = 0;
  window.scrollTo(0, 0);
  currentChapter = num;

  const sidebar = document.getElementById("sidebar");
  if (sidebar.classList.contains("open")) sidebar.classList.remove("open");
}

// ─────────────────────────────────────────────
// SECTIONS
// ─────────────────────────────────────────────
function toggleSection(card) {
  card.classList.toggle("open");
}

// ─────────────────────────────────────────────
// PROGRESS
// ─────────────────────────────────────────────
function isDone(num) {
  return localStorage.getItem(`ch-done-${num}`) === "1";
}

function markDone(num) {
  const current = isDone(num);
  localStorage.setItem(`ch-done-${num}`, current ? "0" : "1");
  renderSidebar();
  updateProgress();
  const btn = document.querySelector(`#chapter-${num} .chapter-nav .btn:not(.btn-accent):not(:first-child)`);
  if (btn && !btn.onclick.toString().includes("showChapter")) {
    btn.textContent = isDone(num) ? '✅ Изучена' : '☐ Отметить изученной';
  }
  // Re-render current chapter nav
  const page = document.getElementById(`chapter-${num}`);
  if (page) {
    const markBtn = page.querySelector('.chapter-nav button:not(.btn-accent)');
    if (markBtn && markBtn.getAttribute('onclick') && markBtn.getAttribute('onclick').includes('markDone')) {
      markBtn.textContent = isDone(num) ? '✅ Изучена' : '☐ Отметить изученной';
    }
  }
}

function toggleDone(e, num) {
  e.stopPropagation();
  const current = isDone(num);
  localStorage.setItem(`ch-done-${num}`, current ? "0" : "1");
  e.target.classList.toggle("checked", !current);
  const navItem = document.getElementById(`nav-${num}`);
  navItem.classList.toggle("done", !current);
  updateProgress();
}

function updateProgress() {
  const done = chapters.filter(ch => isDone(ch.num)).length;
  document.getElementById("progressText").textContent = `${done} / 17`;
  document.getElementById("progressFill").style.width = `${(done / 17) * 100}%`;
}

function _decodeNote(num) {
  const b64 = _NOTES_ENC[String(num)];
  if (!b64) return '';
  const bytes = Uint8Array.from(atob(b64), c => c.charCodeAt(0));
  return new TextDecoder('utf-8').decode(bytes);
}

function _initNote(num) {
  const view = document.getElementById('nview-' + num);
  const ta   = document.getElementById('notes-' + num);
  if (!view || !ta) return;
  view.innerHTML = _decodeNote(num);
  ta.value = localStorage.getItem('note-ch-' + num) || '';
}

function notesTab(num, mode) {
  const view = document.getElementById('nview-' + num);
  const ta   = document.getElementById('notes-' + num);
  const tabs = document.querySelectorAll('#nbox-' + num + ' .notes-tab');
  const edit = mode === 'edit';
  view.style.display = edit ? 'none'  : 'block';
  ta.style.display   = edit ? 'block' : 'none';
  tabs[0].classList.toggle('active', !edit);
  tabs[1].classList.toggle('active',  edit);
  if (edit) ta.focus();
}

// keep autoSave for backwards-compat (oninput calls it on old nodes)
function autoSave(num) {
  const ta = document.getElementById('notes-' + num);
  if (ta) localStorage.setItem('note-ch-' + num, ta.value);
}

function saveNotes() {
  chapters.forEach(ch => autoSave(ch.num));
  const btn = document.querySelector('.topbar-btns .btn:last-child');
  const orig = btn.textContent;
  btn.textContent = '✅ Сохранено!';
  setTimeout(() => { btn.textContent = orig; }, 1500);
}


// ─────────────────────────────────────────────
// SEARCH
// ─────────────────────────────────────────────
function filterChapters(query) {
  const q = query.toLowerCase();
  document.querySelectorAll(".ch-item").forEach((item, idx) => {
    const ch = chapters[idx];
    const match = ch.title.toLowerCase().includes(q) ||
                  ch.subtitle.toLowerCase().includes(q) ||
                  String(ch.num).includes(q);
    item.style.display = match ? "flex" : "none";
  });
}

// ─────────────────────────────────────────────
// COPY CODE
// ─────────────────────────────────────────────
function copyCode(btn) {
  const pre = btn.closest(".code-block").querySelector("pre");
  const text = pre.innerText;
  navigator.clipboard.writeText(text).then(() => {
    btn.textContent = "✅ Скопировано";
    setTimeout(() => { btn.textContent = "📋 Копировать"; }, 2000);
  });
}

// ─────────────────────────────────────────────
// THEME
// ─────────────────────────────────────────────
function toggleTheme() {
  document.body.classList.toggle("light-mode");
  const btn = document.querySelector(".topbar-btns .btn");
  btn.textContent = document.body.classList.contains("light-mode") ? "☀️ Тема" : "🌙 Тема";
  localStorage.setItem("theme", document.body.classList.contains("light-mode") ? "light" : "dark");
}

// ─────────────────────────────────────────────
// MOBILE
// ─────────────────────────────────────────────
function toggleSidebar() {
  document.getElementById("sidebar").classList.toggle("open");
}

// ─────────────────────────────────────────────
// INIT
// ─────────────────────────────────────────────
renderWelcomeGrid();
renderChapters();
  for (let _n = 1; _n <= 17; _n++) _initNote(_n);
renderSidebar();
updateProgress();

// Restore done states in sidebar
chapters.forEach(ch => {
  if (isDone(ch.num)) {
    const item = document.getElementById(`nav-${ch.num}`);
    if (item) item.classList.add("done");
    const check = item?.querySelector(".ch-check");
    if (check) check.classList.add("checked");
  }
});

// Restore theme
if (localStorage.getItem("theme") === "light") {
  document.body.classList.add("light-mode");
  document.querySelector(".topbar-btns .btn").textContent = "☀️ Тема";
}

// Keyboard navigation
document.addEventListener("keydown", e => {
  if (e.target.tagName === "TEXTAREA") return;
  if (e.key === "ArrowRight" && currentChapter < 17) showChapter(currentChapter + 1);
  if (e.key === "ArrowLeft" && currentChapter > 1) showChapter(currentChapter - 1);
  if (e.key === "Escape") showWelcome();
});
</script>
